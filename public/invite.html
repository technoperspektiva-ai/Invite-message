<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#efecfb" />
  <title>Для тебе ♡</title>
  <link rel="stylesheet" href="/style.css?v=11" />
</head>
<body class="invite-page">
  <div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div>

  <main class="invite-shell" id="inviteShell" hidden>
    <header class="invite-head">
      <p class="eyebrow">МАЛЕНЬКЕ ЗАПРОШЕННЯ НА ОСОБЛИВИЙ МОМЕНТ</p>
      <h1 id="heroTitle">Для коханої</h1>
      <p class="lead">Натисни на конверт ♡</p>
    </header>

    <div class="envelope-scene">
      <button class="envelope" id="envelope" type="button" aria-label="Відкрити запрошення" aria-expanded="false">
        <span class="letter-wrap">
          <span class="letter-card"><img id="letterPhoto" alt="" /></span>
        </span>
        <span class="env-back"></span>
        <span class="env-left"></span>
        <span class="env-right"></span>
        <span class="env-bottom"></span>
        <span class="env-flap"></span>
        <span class="seal" aria-hidden="true">♡</span>
      </button>
    </div>

    <button class="primary open-btn" id="openBtn" type="button"><span>Відкрити запрошення</span><b>→</b></button>
    <p class="footer-note">БІЛЬШЕ НІЖ СЛОВА · ♡</p>
  </main>

  <div class="loading" id="loading"><span>♡</span><p>Відкриваємо запрошення…</p></div>
  <div class="not-found" id="notFound" hidden><span>♡</span><h1>Запрошення недоступне</h1><p id="errorText">Спробуй відкрити посилання ще раз.</p></div>

  <div class="full-modal" id="fullModal" hidden>
    <button class="modal-close" id="modalClose" type="button" aria-label="Закрити">×</button>
    <img class="full-photo" id="fullPhoto" alt="Фото" />
  </div>

  <script src="/invite.js?v=11"></script>
</body>
</html>
