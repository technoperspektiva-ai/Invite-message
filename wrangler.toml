name = "invite-message"
main = "src/worker.js"
compatibility_date = "2026-09-20"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/i/*"]

[[durable_objects.bindings]]
name = "INVITES"
class_name = "InvitationStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InvitationStore"]
